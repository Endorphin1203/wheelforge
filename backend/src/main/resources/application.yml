spring:
  datasource:
    url: ${WF_JDBC_URL:jdbc:mysql://localhost:3306/wheelforge?connectionTimeZone=UTC}
    username: ${WF_DATABASE_USER:wheelforge}
    password: ${WF_DATABASE_PASSWORD:wheelforge_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    read:
      strict-duplicate-detection: true
  servlet:
    multipart:
      max-file-size: 512KB
      max-request-size: 1MB
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:${WF_FRONTEND_ROOT:/opt/wheelforge/frontend/dist/}

wheelforge:
  auth:
    token-secret: ${WF_AUTH_TOKEN_SECRET}
  storage:
    data-root: ${WF_DATA_ROOT}
    allow-portable-fallback: ${WF_ALLOW_PORTABLE_STORAGE:false}
  retention:
    enabled: ${WF_RETENTION_ENABLED:false}
    batch-size: ${WF_RETENTION_BATCH_SIZE:100}
    fixed-delay-ms: ${WF_RETENTION_FIXED_DELAY_MS:60000}
    active-download-lease-seconds: ${WF_RETENTION_ACTIVE_DOWNLOAD_LEASE_SECONDS:300}
